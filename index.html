<!-- Document type declaration tells the browser this is an HTML5 page -->
<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Character encoding for the page -->
  <meta charset="UTF-8">
  <!-- Responsive viewport settings for mobile devices -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Compatibility mode for older versions of Internet Explorer -->
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <!-- Page title shown in the browser tab -->
  <title>Savannah's Profile Card</title>
  <!-- Link to the external CSS file that styles the page -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <section class="profile-summary">
    <!-- Profile photo shown above the name inside the introduction card -->
    <img src="img/placeholder.png" alt="Profile placeholder image" class="profile-placeholder">
    <!-- Main heading for the person's name -->
    <h2>Savannah Truong</h2>
    <!-- Subheading for the job title or role -->
    <h3>Front-End Developer</h3>
    <!-- Note to self: make this description more personal and less formal -->
    <p>Passionate about crafting beautiful and accessible web experiences with clean design and thoughtful interactions.</p>
    <h4> My Favorite Websites</h4>
    <!-- List of links styled without default bullets for a cleaner card layout -->
    <ul class="profile-links">
      <li><a href="https://github.com/savannahtruong">GitHub</a></li>
      <li><a href="https://www.linkedin.com/in/savannah-truong/">LinkedIn</a></li>
      <li><a href="https://app.joinhandshake.com/profiles/truongsl">Handshake</a></li>
    </ul>
  </section>
  <!-- Footer area for small legal or attribution text -->
  <footer>
    <p>&copy; 2026 Your Name</p>
  </footer>
</body>
</html>
